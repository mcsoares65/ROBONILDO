<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Robonildo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
  /* Conceito: tela de radar de caça (PPI), um unico olhar, sem numeros. Compra acima, venda abaixo, alvo chega ao anel central. */
  :root {
    color-scheme: dark;
    --bg: #020806;
    --scope: #05180f;
    --phos: #62ff9f;
    --phos-dim: #1d7a47;
    --grid: #0e4528;
    --amber: #ffb627;
    --text: #a4ecc2;
    --text-dim: #4d9a72;
    --font-display: "Chakra Petch", "Eurostile", "Bahnschrift", sans-serif;
    --font-mono: "Share Tech Mono", ui-monospace, "Consolas", monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    padding-inline: 16px;
    padding-block: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    overflow-x: hidden;
  }
  header {
    width: min(100%, 720px);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font: 700 18px/1.2 var(--font-display);
    letter-spacing: .28em;
    color: var(--phos);
  }
  .tag {
    font-size: 12px;
    white-space: nowrap;
    letter-spacing: .18em;
    color: var(--text-dim);
    border: 1px solid var(--grid);
    padding: 3px 8px;
  }
  .scope-wrap {
    position: relative;
    width: min(100%, 78vh, 700px);
    aspect-ratio: 1;
    flex: 0 1 auto;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .status {
    width: min(100%, 720px);
    min-height: 74px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .status .main {
    font: 700 clamp(22px, 5vw, 34px)/1.1 var(--font-display);
    letter-spacing: .22em;
    color: var(--phos);
    text-wrap: balance;
  }
  .status .sub {
    font-size: 14px;
    letter-spacing: .16em;
    color: var(--text-dim);
    min-height: 1.3em;
  }
  .status.aprox .main { color: var(--text); }
  .status.lock .main { color: var(--amber); animation: piscar .55s steps(2, jump-none) infinite; }
  .status.lock .sub { color: var(--amber); }
  @keyframes piscar { 50% { opacity: .25; } }
  .controles {
    width: min(100%, 720px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding-bottom: 4px;
  }
  button {
    font: 500 13px/1 var(--font-mono);
    letter-spacing: .08em;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--grid);
    padding: 10px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--phos-dim); }
  button[aria-pressed="true"] { color: var(--bg); background: var(--phos); border-color: var(--phos); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .tag.vivo { color: var(--phos); border-color: var(--phos-dim); }
  .tag.sem-sinal { color: var(--amber); border-color: var(--amber); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .status.lock .main { animation: none; }
  }
</style>

</head>
<body>
<header>
  <h1>ROBONILDO · RADAR</h1>
  <span class="tag" id="tag">DADOS SIMULADOS</span>
</header>

<div class="scope-wrap">
  <canvas id="tela" role="img" aria-label="Radar com alvos de compra acima e de venda abaixo. O alvo se aproxima do centro conforme a confiança sobe."></canvas>
</div>

<div class="status" id="status" aria-live="polite">
  <div class="main" id="principal">VARRENDO</div>
  <div class="sub" id="secundario">Mercado sem alvo definido</div>
</div>

<div class="controles">
  <button id="b-som" aria-pressed="false">Som: desligado</button>
  <button id="b-voz" aria-pressed="false">Voz: desligada</button>
</div>
<div class="controles" id="sim">
  <button id="b-auto" aria-pressed="true">Automático</button>
  <button id="b-lateral" aria-pressed="false">Mercado lateral</button>
  <button id="b-compra" aria-pressed="false">Compra se aproximando</button>
  <button id="b-venda" aria-pressed="false">Venda se aproximando</button>
</div>

<script>
(function () {
  var cv = document.getElementById('tela');
  var ctx = cv.getContext('2d');
  var elStatus = document.getElementById('status');
  var elMain = document.getElementById('principal');
  var elSub = document.getElementById('secundario');
  var elTag = document.getElementById('tag');
  var elSim = document.getElementById('sim');
  var reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var COR = { phos: '98,255,159', dim: '29,122,71', grid: '14,69,40', amber: '255,182,39' };
  var TWO_PI = Math.PI * 2;
  var VOLTA_S = reduz ? 9 : 4.6;            // segundos por varredura
  var PERMANENCIA_TRAVA_S = 6.5;
  var RAMPA_S = 15;
  var SEM_SINAL_MS = 6000;

  // ---- estrategias do time: rumo (graus a partir do topo) no setor de compra; venda espelha para baixo ----
  var est = [];
  function montarEst(n) {
    est = [];
    for (var i = 0; i < n; i++) {
      var b = n === 1 ? 0 : -54 + i * (110 / (n - 1));
      est.push({ b: b, dir: 1, conf: 0, alvo: 0, rad: 0.92, ang: 0 });
    }
    est.forEach(function (s) { s.ang = rumo(s); });
  }
  function rumo(s) { return (s.dir >= 0 ? s.b : 180 - s.b) * Math.PI / 180; }
  function menorDif(a, b) { var d = (a - b) % TWO_PI; if (d > Math.PI) d -= TWO_PI; if (d < -Math.PI) d += TWO_PI; return d; }
  function sorteio(a, b) { return a + Math.random() * (b - a); }

  var modo = 'lateral', tModo = 0, auto = true, proxAuto = 'compra';
  var lider = 1, trava = null, travaDir = 0, consLive = 0;
  var prox = [0, 0, 0];
  montarEst(3);
  est[0].alvo = est[0].conf = 0.15; est[1].alvo = est[1].conf = 0.2; est[2].alvo = est[2].conf = 0.12;

  // ---- estado ao vivo (publicado pelo robo em radar_estado.js) ----
  var visto = false, ultimoN = null, ultimoNMs = 0, ultimaSeq = null, estadoVivo = null;
  function carregarEstado() {
    var sc = document.createElement('script');
    sc.src = 'radar_estado.js?t=' + Date.now();
    sc.onload = function () { processar(window.RADAR_ESTADO); sc.remove(); };
    sc.onerror = function () { sc.remove(); };
    document.head.appendChild(sc);
  }
  function processar(e) {
    if (!e || !e.estrategias) return;
    visto = true; estadoVivo = e;
    if (e.n !== ultimoN) { ultimoN = e.n; ultimoNMs = performance.now(); }
  }
  function aoVivo() { return visto && (performance.now() - ultimoNMs) < SEM_SINAL_MS; }
  function semSinal() { return visto && !aoVivo(); }
  function aplicarVivo() {
    var e = estadoVivo;
    if (est.length !== e.estrategias.length) montarEst(Math.max(1, e.estrategias.length));
    e.estrategias.forEach(function (x, i) {
      var s = est[i]; if (!s) return;
      if (x.dir !== 0) s.dir = x.dir;
      s.alvo = x.conf;
    });
    consLive = e.consenso || 0;
    if (trava !== null && est[lider]) est[lider].alvo = 1;     // a mira acompanha o alvo ate o fim da captura
    var c = e.captura || { seq: 0, dir: 0 };
    if (ultimaSeq === null) ultimaSeq = c.seq;
    else if (c.seq > ultimaSeq) {
      ultimaSeq = c.seq;
      var melhor = 0, mc = -1;
      est.forEach(function (s, i) { if (s.dir === c.dir && s.conf > mc) { mc = s.conf; melhor = i; } });
      lider = melhor; est[lider].dir = c.dir || est[lider].dir; est[lider].alvo = 1;
      iniciarTrava(c.dir || est[lider].dir);
    }
  }

  function iniciarTrava(dir) {
    trava = 0; travaDir = dir;
    tocarCaptura();
    falar('Alvo capturado. ' + (dir > 0 ? 'Compra.' : 'Venda.'));
  }

  function entrar(m) {
    modo = m; tModo = 0; trava = null;
    if (m === 'compra' || m === 'venda') {
      var d = m === 'compra' ? 1 : -1;
      lider = Math.floor(Math.random() * est.length);
      est.forEach(function (s) { s.dir = d; });
    } else {
      prox = [0, 0, 0];
    }
    marcarBotoes();
  }

  function atualizarSim(dt) {
    tModo += dt;
    if (modo === 'lateral') {
      est.forEach(function (s, i) {
        prox[i] -= dt;
        if (prox[i] <= 0) {
          s.alvo = sorteio(0.05, 0.42);
          if (Math.random() < 0.18) s.dir = -s.dir;
          prox[i] = sorteio(1.4, 3.6);
        }
      });
      if (auto && tModo > 7) { entrar(proxAuto); proxAuto = proxAuto === 'compra' ? 'venda' : 'compra'; }
    } else {
      var p = Math.min(1, tModo / RAMPA_S);
      var base = Math.pow(p, 1.15);
      est.forEach(function (s, i) {
        if (i === lider) s.alvo = base;
        else s.alvo = Math.min(0.92, 0.12 + 0.78 * base * (0.75 + 0.25 * Math.sin(tModo * 0.7 + i)));
      });
      if (trava === null && est[lider].conf >= 0.995) iniciarTrava(est[lider].dir);
      if (trava !== null) {
        trava += dt;
        if (trava > PERMANENCIA_TRAVA_S) entrar('lateral');
      }
    }
  }

  function suavizar(dt) {
    est.forEach(function (s) {
      var k = 1 - Math.exp(-dt * 2.2);
      s.conf += (s.alvo - s.conf) * k;
      var raio = 1 - s.conf * 0.89;
      s.rad += (raio - s.rad) * (1 - Math.exp(-dt * 3.2));
      s.ang += menorDif(rumo(s), s.ang) * (1 - Math.exp(-dt * 3));
    });
  }

  // ---- som e voz ----
  var ac = null, somOn = false, vozOn = false;
  function audio() {
    if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tom(freq, dur, vol, tipo, atraso) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + (atraso || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = tipo || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function pingSonar() { if (!somOn) return; tom(1040, 1.2, 0.15, 'sine'); tom(1040, 1.0, 0.05, 'sine', 0.34); }
  function toqueContato(conf) { if (!somOn) return; tom(1500 + conf * 900, 0.08, 0.06, 'triangle'); }
  function tocarCaptura() {
    if (!somOn) return;
    for (var i = 0; i < 6; i++) tom(1900, 0.09, 0.07, 'square', i * 0.14);
    tom(1900, 1.0, 0.06, 'square', 0.9);
  }
  var ultimaFala = '';
  function falar(texto) {
    if (!vozOn || !window.speechSynthesis) return;
    try {
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = 'pt-BR'; u.rate = 1.0;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    } catch (err) { /* sem voz neste navegador */ }
  }
  function cruzou(ant, cur, ang) {          // a varredura passou por ang entre os dois quadros?
    var d1 = ((ang - ant) % TWO_PI + TWO_PI) % TWO_PI, d2 = ((cur - ant) % TWO_PI + TWO_PI) % TWO_PI;
    return d1 > 0 && d1 <= d2;
  }

  // ---- desenho ----
  var W = 0, H = 0, dpr = 1;
  function ajustar() {
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(200, Math.round(r.width)); H = W;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (window.ResizeObserver) new ResizeObserver(ajustar).observe(cv); else window.addEventListener('resize', ajustar);
  ajustar();

  function pt(cx, cy, r, ang) { return [cx + r * Math.sin(ang), cy - r * Math.cos(ang)]; }
  function rgba(c, a) { return 'rgba(' + c + ',' + a + ')'; }

  function desenhar(varredura) {
    var cx = W / 2, cy = H / 2, R = W * 0.41;
    ctx.clearRect(0, 0, W, H);

    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.05);
    g.addColorStop(0, '#07261a'); g.addColorStop(1, '#030f09');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TWO_PI); ctx.fill();

    ctx.lineWidth = 1;
    [0.25, 0.5, 0.75, 1].forEach(function (f, i) {
      ctx.strokeStyle = rgba(COR.grid, i === 3 ? 1 : 0.9);
      ctx.beginPath(); ctx.arc(cx, cy, R * f, 0, TWO_PI); ctx.stroke();
    });
    ctx.setLineDash([4, 5]); ctx.strokeStyle = rgba(COR.amber, 0.55);
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.145, 0, TWO_PI); ctx.stroke(); ctx.setLineDash([]);

    ctx.strokeStyle = rgba(COR.grid, 0.9);
    ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
    ctx.strokeStyle = rgba(COR.dim, 0.8); ctx.setLineDash([2, 6]);
    ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke(); ctx.setLineDash([]);

    for (var d = 0; d < 360; d += 10) {
      var a = d * Math.PI / 180, longa = d % 30 === 0;
      var p1 = pt(cx, cy, R, a), p2 = pt(cx, cy, R * (longa ? 0.94 : 0.965), a);
      ctx.strokeStyle = rgba(COR.dim, longa ? 1 : 0.7);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
    }

    var aV = varredura - Math.PI / 2, trilha = 1.25;
    if (ctx.createConicGradient) {
      var cg = ctx.createConicGradient(aV - trilha, cx, cy), f = trilha / TWO_PI;
      cg.addColorStop(0, rgba(COR.phos, 0));
      cg.addColorStop(f, rgba(COR.phos, 0.34));
      cg.addColorStop(Math.min(1, f + 0.002), rgba(COR.phos, 0));
      cg.addColorStop(1, rgba(COR.phos, 0));
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TWO_PI); ctx.fill();
    }
    var pe = pt(cx, cy, R, varredura);
    ctx.strokeStyle = rgba(COR.phos, 0.95); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(pe[0], pe[1]); ctx.stroke(); ctx.lineWidth = 1;

    ctx.font = '500 ' + Math.max(11, W * 0.021) + 'px "Chakra Petch", sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = rgba(COR.phos, 0.75);
    ctx.fillText('C O M P R A', cx, cy - R - 24);
    ctx.fillText('V E N D A', cx, cy + R + 32);

    // consenso do time (borda externa)
    var cons;
    if (aoVivo() || semSinal()) cons = Math.max(0, Math.min(1, consLive));
    else {
      var soma = 0; est.forEach(function (s) { soma += s.dir * s.conf; });
      var domin = soma >= 0 ? 1 : -1; cons = 0;
      est.forEach(function (s) { if (s.dir === domin) cons += s.conf; });
      cons = Math.min(1, cons / est.length);
    }
    ctx.lineWidth = 5; ctx.lineCap = 'butt';
    ctx.strokeStyle = rgba(COR.grid, 0.8);
    ctx.beginPath(); ctx.arc(cx, cy, R + 12, 0, TWO_PI); ctx.stroke();
    ctx.strokeStyle = rgba(trava !== null ? COR.amber : COR.phos, 0.9);
    ctx.beginPath(); ctx.arc(cx, cy, R + 12, -Math.PI / 2, -Math.PI / 2 + cons * TWO_PI); ctx.stroke();
    ctx.lineWidth = 1;

    est.forEach(function (s, i) {
      var ang = s.ang, p = pt(cx, cy, R * s.rad, ang);
      var dv = ((varredura - ang) % TWO_PI + TWO_PI) % TWO_PI;
      var br = Math.max(0.18, Math.exp(-dv / (TWO_PI * 0.42)));
      var travado = trava !== null && i === lider;
      var cor = travado ? COR.amber : COR.phos;
      var tam = Math.max(3.5, W * 0.0085) * (0.8 + 0.5 * s.conf);
      var h = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], tam * 4.5);
      h.addColorStop(0, rgba(cor, 0.5 * br)); h.addColorStop(1, rgba(cor, 0));
      ctx.fillStyle = h; ctx.beginPath(); ctx.arc(p[0], p[1], tam * 4.5, 0, TWO_PI); ctx.fill();
      ctx.fillStyle = rgba(cor, 0.35 + 0.65 * br);
      ctx.beginPath();
      ctx.moveTo(p[0], p[1] - tam); ctx.lineTo(p[0] + tam, p[1]); ctx.lineTo(p[0], p[1] + tam); ctx.lineTo(p[0] - tam, p[1]);
      ctx.closePath(); ctx.fill();
      if (travado) {
        var e = Math.min(1, trava / 0.9), fe = 1 - Math.pow(1 - e, 3);
        var lado = W * (0.17 - 0.12 * fe), cc = Math.min(lado * 0.45, 22);
        ctx.strokeStyle = rgba(COR.amber, 1); ctx.lineWidth = 2;
        [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(function (q) {
          var x = p[0] + q[0] * lado, y = p[1] + q[1] * lado;
          ctx.beginPath(); ctx.moveTo(x - q[0] * cc, y); ctx.lineTo(x, y); ctx.lineTo(x, y - q[1] * cc); ctx.stroke();
        });
        var pul = (trava % 1.1) / 1.1;
        ctx.strokeStyle = rgba(COR.amber, 0.7 * (1 - pul)); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(p[0], p[1], W * (0.03 + 0.1 * pul), 0, TWO_PI); ctx.stroke();
        ctx.lineWidth = 1;
      }
    });

    ctx.fillStyle = rgba(COR.phos, 0.9);
    ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, TWO_PI); ctx.fill();
  }

  // ---- texto de estado ----
  var ultimoTxt = '', ultimoNivel = '', ultimoTag = '';
  function atualizarTexto() {
    var vivo = aoVivo(), sem = semSinal();
    var tagTxt = sem ? 'SEM SINAL DO ROBÔ' : vivo ? (estadoVivo.modo === 'replay' ? 'AO VIVO · REPLAY' : 'AO VIVO') : 'DADOS SIMULADOS';
    if (tagTxt !== ultimoTag) {
      ultimoTag = tagTxt; elTag.textContent = tagTxt;
      elTag.className = 'tag' + (sem ? ' sem-sinal' : vivo ? ' vivo' : '');
      elSim.hidden = vivo || sem;
    }
    var maxc = 0; est.forEach(function (s) { if (s.conf > maxc) maxc = s.conf; });
    var m, sub, cls = '', nivel = 'v';
    if (trava !== null) {
      var lado = travaDir > 0 ? 'COMPRA' : 'VENDA';
      var envia = vivo && estadoVivo && estadoVivo.radar_envia_ordens;
      m = 'ALVO CAPTURADO!';
      sub = lado + ' · ' + (vivo ? (envia ? 'ORDEM ENVIADA' : 'RADAR NÃO ENVIA ORDEM (TESTE)') : 'ORDEM ENVIADA (SIMULAÇÃO)');
      cls = 'lock'; nivel = 'c';
    }
    else if (sem) { m = 'SEM SINAL'; sub = 'O robô parou de publicar o estado'; cls = 'aprox'; nivel = 's'; }
    else if (maxc >= 0.7) { m = 'ALVO TRAVANDO'; sub = 'Aguardando confirmação no fechamento do candle'; cls = 'aprox'; nivel = 't'; }
    else if (maxc >= 0.45) { m = 'ALVO EM APROXIMAÇÃO'; sub = 'Time acompanhando'; cls = 'aprox'; nivel = 'a'; }
    else { m = 'VARRENDO'; sub = 'Mercado sem alvo definido'; }
    var chave = m + sub + cls;
    if (chave !== ultimoTxt) { ultimoTxt = chave; elMain.textContent = m; elSub.textContent = sub; elStatus.className = 'status ' + cls; }
    if (nivel !== ultimoNivel) {
      if (nivel === 't') falar('Alvo travando.');
      ultimoNivel = nivel;
    }
  }

  // ---- controles ----
  var bAuto = document.getElementById('b-auto'), bLat = document.getElementById('b-lateral'),
      bCom = document.getElementById('b-compra'), bVen = document.getElementById('b-venda'),
      bSom = document.getElementById('b-som'), bVoz = document.getElementById('b-voz');
  function marcarBotoes() {
    bAuto.setAttribute('aria-pressed', auto ? 'true' : 'false');
    bLat.setAttribute('aria-pressed', !auto && modo === 'lateral' ? 'true' : 'false');
    bCom.setAttribute('aria-pressed', !auto && modo === 'compra' ? 'true' : 'false');
    bVen.setAttribute('aria-pressed', !auto && modo === 'venda' ? 'true' : 'false');
  }
  bAuto.addEventListener('click', function () { auto = true; entrar('lateral'); tModo = 3; proxAuto = 'compra'; marcarBotoes(); });
  bLat.addEventListener('click', function () { auto = false; entrar('lateral'); });
  bCom.addEventListener('click', function () { auto = false; entrar('compra'); });
  bVen.addEventListener('click', function () { auto = false; entrar('venda'); });
  bSom.addEventListener('click', function () {
    somOn = !somOn;
    bSom.setAttribute('aria-pressed', somOn ? 'true' : 'false');
    bSom.textContent = somOn ? 'Som: ligado' : 'Som: desligado';
    if (somOn) { audio(); pingSonar(); }
  });
  bVoz.addEventListener('click', function () {
    vozOn = !vozOn;
    bVoz.setAttribute('aria-pressed', vozOn ? 'true' : 'false');
    bVoz.textContent = vozOn ? 'Voz: ligada' : 'Voz: desligada';
    if (vozOn) falar('Voz do radar ligada.'); else if (window.speechSynthesis) window.speechSynthesis.cancel();
  });

  // ---- laco ----
  var t0 = performance.now(), ult = t0, varrAnt = 0;
  function quadro(agora) {
    var dt = Math.min(0.1, (agora - ult) / 1000); ult = agora;
    if (aoVivo()) {
      aplicarVivo();
      if (trava !== null) { trava += dt; if (trava > PERMANENCIA_TRAVA_S) trava = null; }
    } else if (!semSinal()) atualizarSim(dt);
    else if (trava !== null) { trava += dt; if (trava > PERMANENCIA_TRAVA_S) trava = null; }
    suavizar(dt);
    var varr = (((agora - t0) / 1000) / VOLTA_S % 1) * TWO_PI;
    if (varr < varrAnt) pingSonar();                       // uma volta completa = um ping
    else if (somOn) est.forEach(function (s) { if (s.conf >= 0.45 && cruzou(varrAnt, varr, s.ang)) toqueContato(s.conf); });
    varrAnt = varr;
    desenhar(varr);
    atualizarTexto();
    requestAnimationFrame(quadro);
  }
  entrar('lateral'); tModo = 3; marcarBotoes();
  carregarEstado(); setInterval(carregarEstado, 1000);
  requestAnimationFrame(quadro);
})();
